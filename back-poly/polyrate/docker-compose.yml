services:
  postgres:
    image: postgres:16
    container_name: polyrate_db
    environment:
      POSTGRES_DB: polyrate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - polyrate-network

volumes:
  postgres_data:

networks:
  polyrate-network:
    driver: bridge